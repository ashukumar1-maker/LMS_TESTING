steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "buildx"
      - "build"
      - "--platform"
      - "linux/amd64"
      - "-t"
      - "${_IMAGE_URI}:${_IMAGE_TAG}"
      - "-t"
      - "${_IMAGE_URI}:latest"
      - "."
    env:
      - "DOCKER_BUILDKIT=1"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_IMAGE_URI}"

substitutions:
  _IMAGE_URI: "us-central1-docker.pkg.dev/${PROJECT_ID}/backend/backend"
  _IMAGE_TAG: "latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
