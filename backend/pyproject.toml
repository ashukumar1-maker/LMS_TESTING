[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.2",
    "starlette>=1.3.1",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "alembic",
    "python-dotenv",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.14.2",
    "requests>=2.32.3",
    "httpx>=0.28.1",
    "firebase-admin>=7.5.0",
    "asyncpg>=0.30.0",
    "sentry-sdk[asyncpg,fastapi,sqlalchemy,openai]>=2.57.0",
    "cachetools>=5.5.0",
    "aiofiles>=24.1.0",
    "jinja2>=3.1.6",                                         # This is needed for sentry-sdk to properly initialize
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "google-auth>=2.56.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.26.0",
    "ruff==0.15.13",
    "pre-commit>=4.6.1",
    "ipykernel>=7.1.0",
    "testcontainers[postgres]>=4.13.3",
    "basedpyright>=1.39.9",
]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "ARG",
    "TID",
    "UP",
    "W",
    "ANN",
    "S",
    "DOC",
    "ASYNC",
    "FAST",
    "ERA",
    "PLR",
    "C901",
    "PLW",
    "PGH",
    "RUF",
    "TRY",
    "FURB",
    "A",
    "C4",
    "DTZ",
    "EXE",
    "FA",
    "G",
    "LOG",
    "N",
    "PIE",
    "PT",
    "RET",
    "RSE",
    "T10",
    "TC",
    "YTT",
    "D",
    "FBT"
]
ignore = ["E501", "TC001", "TC002", "B008", "N815"]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.dialects.postgresql.JSONB".msg = "Do not use JSONB in SQLAlchemy models. Model structured data with typed relational columns and tables instead."
"sqlalchemy.dialects.postgresql.json.JSONB".msg = "Do not use JSONB in SQLAlchemy models. Model structured data with typed relational columns and tables instead."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/*test*.py" = ["S101"]

[tool.ruff.lint.pylint]
max-args = 7
max-positional-args = 7
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 17

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.basedpyright]
include = ["src", "tests", "alembic", "generate_openapi.py"]
stubPath = "typings"
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "recommended"
failOnWarnings = true
reportAny = "error"
reportExplicitAny = "error"
reportMissingTypeArgument = "error"
reportUnknownParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownVariableType = "error"
reportUnknownMemberType = "error"
reportMissingParameterType = "error"
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitRelativeImport = "error"
reportInvalidCast = "error"
reportUnreachable = "error"
strictGenericNarrowing = true
reportMissingTypeStubs = "error"
reportPrivateLocalImportUsage = "error"
reportUnsafeMultipleInheritance = "error"
reportImplicitAbstractClass = "error"
